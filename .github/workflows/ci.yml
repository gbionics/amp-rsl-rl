name: 🧪 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [default, rsl-rl-min]

    name: tests (${{ matrix.environment }})
    steps:
      - uses: actions/checkout@v4

      - name: 📦 Set up pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: ${{ matrix.environment }}
          locked: true
          cache: true

      - name: 🧪 Run tests
        run: pixi run -e ${{ matrix.environment }} test
